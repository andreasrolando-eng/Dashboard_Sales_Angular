name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_SLUG: ${{ github.event.repository.name }}
  REGISTRY: ghcr.io/operations-esb

jobs:
  check:
    # Jaring pengaman: sama dengan `make check` di lokal. Hook lokal bisa dilewati (--no-verify), ini tidak.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: npm, cache-dependency-path: web-app/package-lock.json }
      - run: go install github.com/pressly/goose/v3/cmd/goose@latest
      - run: make check-ci

  build-and-deploy:
    needs: check
    runs-on: ubuntu-latest
    concurrency: production
    # NOTE: repo belum punya SSH_HOST/SSH_USER/SSH_PRIVATE_KEY secrets sampai
    # server production siap (lihat docs/2026-09-28-migrasi-tech-stack.md).
    # Build+push ke GHCR aman dijalankan sejak sekarang; step deploy akan
    # gagal sampai secrets diisi — itu normal, bukan bug.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.APP_SLUG }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build & push web-app
        uses: docker/build-push-action@v6
        with:
          context: ./web-app
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.APP_SLUG }}-web-app:${{ github.sha }}
          cache-from: type=gha,scope=web-app
          cache-to: type=gha,mode=max,scope=web-app
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /opt/apps/${{ env.APP_SLUG }}
            IMAGE_TAG=${{ github.sha }} ./deploy.sh
