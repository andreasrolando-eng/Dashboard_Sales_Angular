server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Kesehatan API yang sebenarnya untuk pemantauan eksternal (bukan sekadar halaman web).
    location = /healthz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /auth/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
